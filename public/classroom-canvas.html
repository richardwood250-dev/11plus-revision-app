<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Whiteboard</title>
  <link rel="stylesheet" href="https://unpkg.com/@excalidraw/excalidraw@0.18.1/dist/prod/index.css">
  <style>
    * { box-sizing: border-box; }
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8FAFC;
    }
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-screen">
      <div style="font-size: 32px; margin-bottom: 12px;">🎨</div>
      <div style="font-weight: 600;">Loading Collaborative Canvas...</div>
    </div>
  </div>

  <script src="/whiteboard-bundle.js"></script>
</body>
</html>
